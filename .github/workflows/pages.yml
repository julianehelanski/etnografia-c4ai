name: Publica o site no GitHub Pages

# Republica o site estático a cada push na main — inclusive os commits
# automáticos do analyze.yml que regeneram a análise de redes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas exigidas pelo deploy de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez; cancela um anterior ainda em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (raiz do repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
