name: Publica o site no GitHub Pages

# Republica o site estático a cada push na main e também quando o analyze.yml
# termina. O gatilho workflow_run é necessário porque os commits automáticos do
# analyze (feitos com o GITHUB_TOKEN) NÃO disparam o evento push em outros
# workflows — sem isso, as regenerações da análise nunca eram publicadas.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Analisa capítulos da tese"]
    types: [completed]
  workflow_dispatch:

# Permissões mínimas exigidas pelo deploy de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez; cancela um anterior ainda em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # em workflow_run, só publica se a análise terminou com sucesso
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (raiz do repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
