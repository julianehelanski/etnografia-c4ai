name: Analisa capítulos da tese

# Dispara em três situações:
#  1. repository_dispatch (event_type = thesis-updated) — vindo do repo etnografia
#     toda vez que um capítulo é alterado lá. Veja
#     docs/dispatch-from-tex.yml.example para o workflow que dispara este.
#  2. workflow_dispatch — botão "Run workflow" no GitHub Actions, para
#     reanálise manual.
#  3. push em qualquer arquivo da análise (script, manifesto, interpretação),
#     para que mudanças metodológicas regenerem os outputs automaticamente.
on:
  repository_dispatch:
    types: [thesis-updated]
  workflow_dispatch:
    inputs:
      only:
        description: "Slugs separados por vírgula (vazio = todos os habilitados)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "infranodus/infranodus_cap1.py"
      - "infranodus/run_all.py"
      - "infranodus/chapters.yml"
      - "infranodus/interpretation_*.md"
      - ".github/workflows/analyze.yml"

permissions:
  contents: write

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout etnografia-c4ai
        uses: actions/checkout@v4
        with:
          path: c4ai

      - name: Checkout etnografia (.tex)
        uses: actions/checkout@v4
        with:
          repository: julianehelanski/etnografia
          # Se o repo .tex for privado, defina o secret ETNOGRAFIA_PAT como um
          # Personal Access Token com escopo `repo` (fine-grained: read contents
          # do repositório etnografia). Se for público, o GITHUB_TOKEN padrão
          # funciona.
          token: ${{ secrets.ETNOGRAFIA_PAT || secrets.GITHUB_TOKEN }}
          path: c4ai/_tex
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        working-directory: c4ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        working-directory: c4ai
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            python infranodus/run_all.py --source-root _tex --only "$ONLY"
          else
            python infranodus/run_all.py --source-root _tex
          fi

      - name: Commit & push outputs
        working-directory: c4ai
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infranodus/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos outputs da análise."
            exit 0
          fi
          SOURCE_SHA="${{ github.event.client_payload.sha || 'manual' }}"
          git commit -m "Regenerate text networks from etnografia@${SOURCE_SHA:0:7}"
          # Push retry com backoff exponencial (2s, 4s, 8s, 16s).
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1
